name: Environment Variable Demo

on:
  workflow_dispatch:


env:
  PROJECT_NAME: github-actions-learning
  ENVIRONMENT: learning


jobs:

  environment-demo:

    runs-on: self-hosted

    env:
      APP_VERSION: 1.0.0


    steps:

      - name: Display Workflow Variables
        run: |
          echo "Project Name:"
          echo $PROJECT_NAME

          echo "Environment:"
          echo $ENVIRONMENT


      - name: Display Job Variable
        run: |
          echo "Application Version:"
          echo $APP_VERSION


      - name: Step Level Variable Example
        env:
          DATABASE: PostgreSQL

        run: |
          echo "Database:"
          echo $DATABASE


      - name: System Information
        run: |
          echo "Running on:"
          hostname

          echo "User:"
          whoami
