name: Blue Green Deployment

on:
  workflow_dispatch:

env:
  IMAGE_NAME: node-app
  BLUE_CONTAINER: node-app-blue
  GREEN_CONTAINER: node-app-green
  BLUE_PORT: 3001
  GREEN_PORT: 3002

jobs:

  # ==========================================
  # Stage 1 - Build Docker Image
  # ==========================================

  build:
    name: Build Docker Image
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t ${IMAGE_NAME}:green ./node-app

      - name: Verify Docker Image
        run: |
          docker images ${IMAGE_NAME}

  # ==========================================
  # Stage 2 - Deploy Green Environment
  # ==========================================

  deploy-green:
    name: Deploy Green Environment
    needs: build
    runs-on: self-hosted

    steps:
      - name: Remove Existing Green Container
        run: |
          docker stop ${GREEN_CONTAINER} || true
          docker rm ${GREEN_CONTAINER} || true

      - name: Start Green Container
        run: |
          docker run -d \
            --name ${GREEN_CONTAINER} \
            -p ${GREEN_PORT}:3001 \
            ${IMAGE_NAME}:green

      - name: Verify Green Container
        run: |
          docker ps

  # ==========================================
  # Stage 3 - Health Check
  # ==========================================

  health-check:
    name: Health Check
    needs: deploy-green
    runs-on: self-hosted

    steps:
      - name: Wait for Application
        run: |
          sleep 10

      - name: Verify Application
        run: |
          curl http://localhost:${GREEN_PORT}

  # ==========================================
  # Stage 4 - Switch Traffic
  # ==========================================

  switch:
    name: Switch Traffic to Green
    needs: health-check
    runs-on: self-hosted

    steps:
      - name: Stop Blue Container
        run: |
          docker stop ${BLUE_CONTAINER} || true
          docker rm ${BLUE_CONTAINER} || true

      - name: Rename Green to Blue
        run: |
          docker rename ${GREEN_CONTAINER} ${BLUE_CONTAINER}

      - name: Verify Deployment
        run: |
          docker ps

      - name: Deployment Successful
        run: |
          echo "Blue-Green Deployment Completed Successfully"

  # ==========================================
  # Stage 5 - Final Verification
  # ==========================================

  verify:
    name: Final Verification
    needs: switch
    runs-on: self-hosted

    steps:
      - name: Running Containers
        run: |
          docker ps

      - name: Verify Application
        run: |
          curl http://localhost:${BLUE_PORT}

      - name: Finished
        run: |
          echo "Application is running successfully."
