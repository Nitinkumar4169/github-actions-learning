name: Production CI/CD Pipeline


on:

  push:
    branches:
      - main

  workflow_dispatch:



# Prevent multiple deployments running together

concurrency:

  group: production-deployment

  cancel-in-progress: true




jobs:



# ======================================================
# Stage 1 : Build and Test
# ======================================================


  build-test:


    name: Build and Test Application


    runs-on: self-hosted


    defaults:

      run:

        working-directory: node-app



    steps:


      - name: Checkout Repository

        uses: actions/checkout@v4



      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 20

          cache: npm

          cache-dependency-path: node-app/package-lock.json



      - name: Install Dependencies

        run: npm install



      - name: Run Unit Tests

        run: npm test



      - name: Build Application

        run: npm run build



      - name: Build Completed

        run: echo "Application build completed successfully"





# ======================================================
# Stage 2 : Security Scan
# ======================================================



  security-scan:


    name: Security Vulnerability Scan


    needs: build-test


    runs-on: self-hosted



    steps:



      - name: Checkout Repository

        uses: actions/checkout@v4



      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: 20



      - name: Install Dependencies

        working-directory: node-app

        run: npm install



      - name: Run NPM Audit

        working-directory: node-app

        run: |

          npm audit --json > audit-report.json || true



      - name: Upload Security Report

        uses: actions/upload-artifact@v4

        with:

          name: npm-security-report

          path: node-app/audit-report.json





# ======================================================
# Stage 3 : SonarQube Code Quality
# ======================================================



  sonarqube-analysis:


    name: SonarQube Analysis


    needs: security-scan


    runs-on: self-hosted



    steps:



      - name: Checkout Repository

        uses: actions/checkout@v4



      - name: SonarQube Scan

        uses: SonarSource/sonarqube-scan-action@v6


        env:


          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}





# ======================================================
# Stage 4 : Docker Build
# ======================================================



  docker-build:


    name: Docker Image Build


    needs: sonarqube-analysis


    runs-on: self-hosted



    steps:



      - name: Checkout Repository

        uses: actions/checkout@v4



      - name: Build Docker Image


        run: |


          docker build \
          -t node-app:${{ github.sha }} \
          ./node-app



      - name: Tag Latest Image


        run: |


          docker tag node-app:${{ github.sha }} node-app:latest



      - name: Verify Docker Image


        run: |


          docker images node-app





# ======================================================
# Stage 5 : Production Deployment
# ======================================================



  deploy:


    name: Deploy Application


    needs: docker-build


    runs-on: self-hosted



    environment:

      name: production



    steps:



      - name: Stop Old Container


        run: |


          docker stop node-app-container || true

          docker rm node-app-container || true





      - name: Deploy New Container


        run: |


          docker run -d \
          --name node-app-container \
          -p 3001:3001 \
          --restart always \
          node-app:latest





      - name: Verify Deployment


        run: |


          sleep 10

          docker ps | grep node-app-container





# ======================================================
# Stage 6 : Application Health Check
# ======================================================



  health-check:


    name: Application Health Check


    needs: deploy


    runs-on: self-hosted



    steps:



      - name: Check Application Endpoint


        run: |


          curl -f http://localhost:3001 || exit 1



      - name: Deployment Successful


        run: |


          echo "Production deployment completed successfully"
