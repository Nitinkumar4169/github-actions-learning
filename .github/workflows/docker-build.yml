name: Docker Build Test

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker Version
        run: docker --version

      - name: Build Docker Image
        run: |
          docker build -t hello-docker:v1 ./docker-app

      - name: Show Images
        run: docker images
