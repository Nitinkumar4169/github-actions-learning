name: Production CI/CD Pipeline


on:

  push:

    branches:

      - main


  workflow_dispatch:



# ==================================================
# Stage 1 - Build and Test
# ==================================================


jobs:


  build-test:


    name: Build and Test Application

    runs-on: self-hosted


    defaults:

      run:

        working-directory: node-app



    steps:


      - name: Checkout Repository

        uses: actions/checkout@v4



      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 20

          cache: npm

          cache-dependency-path: node-app/package-lock.json



      - name: Install Dependencies

        run: npm install



      - name: Run Tests

        run: npm test



      - name: Build Application

        run: npm run build



      - name: Build Completed

        run: echo "Build and testing completed successfully"



# ==================================================
# Stage 2 - Security Scan + Report
# ==================================================


  security-scan:


    name: Security Vulnerability Scan


    needs: build-test


    runs-on: self-hosted



    steps:



      - name: Checkout Repository

        uses: actions/checkout@v4



      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 20

          cache: npm

          cache-dependency-path: node-app/package-lock.json



      - name: Install Dependencies

        working-directory: node-app

        run: npm install



      - name: Run npm Audit

        working-directory: node-app

        run: |

          npm audit --json > audit-report.json || true



      - name: Upload Security Report

        uses: actions/upload-artifact@v4

        with:

          name: npm-security-report

          path: node-app/audit-report.json



# ==================================================
# Stage 3 - SonarQube Code Quality Analysis
# ==================================================


  sonarqube-analysis:


    name: SonarQube Analysis


    needs: security-scan


    runs-on: self-hosted



    steps:



      - name: Checkout Repository

        uses: actions/checkout@v4



      - name: SonarQube Scan

        uses: SonarSource/sonarqube-scan-action@v6

        env:

          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}



# ==================================================
# Stage 4 - Docker Build
# ==================================================


  docker-build:


    name: Docker Image Build


    needs: sonarqube-analysis


    runs-on: self-hosted



    steps:



      - name: Checkout Repository

        uses: actions/checkout@v4



      - name: Build Docker Image

        run: |

          docker build -t node-app:latest ./node-app



      - name: Verify Docker Image

        run: |

          docker images node-app



      - name: Docker Build Completed

        run: echo "Docker image created successfully"



# ==================================================
# Stage 5 - Deployment
# ==================================================


  deploy:


    name: Application Deployment


    needs: docker-build


    runs-on: self-hosted



    steps:



      - name: Stop Existing Container

        run: |

          docker stop node-app-container || true

          docker rm node-app-container || true



      - name: Deploy New Container

        run: |

          docker run -d \

          --name node-app-container \

          -p 3001:3001 \

          node-app:latest



      - name: Deployment Completed

        run: echo "Application deployed successfully"



# ==================================================
# Stage 6 - Health Check
# ==================================================


  health-check:


    name: Application Health Check


    needs: deploy


    runs-on: self-hosted



    steps:



      - name: Check Running Container

        run: |

          docker ps | grep node-app-container



      - name: Application Health Status

        run: echo "Application is running successfully"
